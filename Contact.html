<body>

    <!-- HEADER -->
    <header>
        <h1>Karabo Nail Bar & Hair Salon</h1>

        <!-- NAVIGATION -->
        <nav>

                <a href="index.html">Home</a> |

    <hr>

    <!-- ENQUIRY FORM -->
    <section>
        <h2>Make an Enquiry</h2>
        <p>Fill in the form below and we will get back to you shortly.</p>

        <form action="#" method="post">

            <!-- NAME -->
            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Your full name" required>
            </p>

            <!-- EMAIL -->
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="Your email address" required>
            </p>

            <!-- PHONE -->
            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="Your phone number">
            </p>

            <!-- SERVICE -->
            <p>
                <label for="service">Service of Interest:</label><br>
                <select id="service" name="service">
                    <option value="">Select a service</option>
                    <option value="manicure">Manicure</option>
                    <option value="pedicure">Pedicure</option>
                    <option value="nail-art">Nail Art</option>
                    <option value="hair-cut">Hair Cut</option>
                    <option value="hair-colour">Hair Colour</option>
                    <option value="hair-treatment">Hair Treatment</option>
                    <option value="other">Other</option>
                </select>
            </p>

            <!-- MESSAGE -->
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" placeholder="Your message or question"></textarea>
            </p>

            <!-- SUBMIT -->
            <p>
                <button type="submit">Send Enquiry</button>
            </p>

        </form>
    </section>

    <hr>

    <!-- FOOTER -->
    <footer>

    </footer>

</body>
